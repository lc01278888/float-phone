name: Build Android Shell APK

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [test]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    # 可选签名：仓库 Secrets 配置了 SHELL_KEYSTORE_BASE64 等四项时产出已签名 release
    env:
      SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
      SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
      SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
      SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
      SHELL_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
      SHELL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Decode keystore (optional)
        if: ${{ env.SHELL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$SHELL_KEYSTORE_BASE64" | base64 -d > /tmp/shell.keystore
          echo "SHELL_KEYSTORE_FILE=/tmp/shell.keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk

      - name: Publish installable debug snapshot
        if: github.ref == 'refs/heads/test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-test-latest
          name: Latest installable debug APK (test branch)
          prerelease: true
          make_latest: false
          files: android-shell/app/build/outputs/apk/debug/app-debug.apk
          body: |
            自动构建的可安装测试包，仅用于首次安装和验收。
            正式的应用内更新使用 v* 标签发布的、长期签名的 float-phone.apk。

      - name: Prepare GitHub Release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.SHELL_KEYSTORE_BASE64 != ''
        run: cp android-shell/app/build/outputs/apk/release/app-release.apk float-phone.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.SHELL_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: float-phone.apk
          generate_release_notes: true
